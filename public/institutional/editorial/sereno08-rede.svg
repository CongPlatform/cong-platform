<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Mapa ilustrativo das conexões de cuidado</title><desc id="desc">Rede esquemática de três iniciativas: convivência, orientação e autonomia. Não é um mapa geográfico.</desc><rect width="1100" height="650" fill="#E6EAE0" rx="30"/><g stroke="#728A71" stroke-width="4" fill="none"><path d="M105 325C300 80 650 80 935 300"/><path d="M110 325C290 540 650 560 930 300"/><path d="M340 132Q550 315 345 515"/><path d="M720 110Q520 325 725 528"/></g><g fill="#26483D"><circle cx="105" cy="325" r="24"/><circle cx="345" cy="132" r="24"/><circle cx="720" cy="528" r="24"/></g><g fill="#B57454"><circle cx="935" cy="300" r="24"/><circle cx="345" cy="515" r="20"/><circle cx="720" cy="110" r="20"/></g><g font-family="Arial,sans-serif" fill="#20382F" font-size="30" font-weight="700"><text x="50" y="270">ESCUTA</text><text x="250" y="85">ENCONTRO</text><text x="705" y="585">AUTONOMIA</text><text x="780" y="270">PERTENCER</text></g><g font-family="Arial,sans-serif" fill="#526A5B" font-size="19"><text x="440" y="300">Percursos de apoio</text><text x="435" y="332">— diagrama editável —</text></g></svg>